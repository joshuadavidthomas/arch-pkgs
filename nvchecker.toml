[claude-desktop]
source = "apt"
mirror = "https://downloads.claude.ai/claude-desktop/apt/stable"
suite = "stable"
pkg = "claude-desktop"

[codiff]
source = "github"
github = "nkzw-tech/codiff"
use_latest_release = true
prefix = "v"

[crush]
source = "github"
github = "charmbracelet/crush"
use_latest_release = true
prefix = "v"

[dotenv-linter]
source = "github"
github = "dotenv-linter/dotenv-linter"
use_latest_release = true
prefix = "v"

[flyctl]
source = "github"
github = "superfly/flyctl"
use_latest_release = true
prefix = "v"

[gitbutler]
source = "regex"
url = "https://app.gitbutler.com/releases/release?limit=1"
regex = 'releases/release/([0-9.]+-[0-9]+)/linux/x86_64/'
from_pattern = '^([0-9.]+)-([0-9]+)$'
to_pattern = '\1.\2'

[handy]
source = "github"
github = "cjpais/Handy"
use_latest_release = true
prefix = "v"

[heroic-games-launcher]
source = "github"
github = "Heroic-Games-Launcher/HeroicGamesLauncher"
use_latest_release = true
prefix = "v"

[jjui]
source = "github"
github = "idursun/jjui"
use_latest_release = true
prefix = "v"

[littlesnitch]
source = "regex"
url = "https://obdev.at/products/littlesnitch-linux/download.html"
regex = 'littlesnitch-([0-9]+\.[0-9]+\.[0-9]+-[0-9]+)-x86_64\.pkg\.tar\.zst'
from_pattern = '^(.*)-([0-9]+)$'
to_pattern = '\1_\2'

[overmind]
source = "github"
github = "DarthSim/overmind"
use_latest_release = true
prefix = "v"

[pandoc]
source = "github"
github = "jgm/pandoc"
use_latest_release = true

[paper-design]
source = "httpheader"
url = "https://download.paper.design/linux/deb"
header = "Content-Disposition"
regex = 'paper-desktop-([\d.]+?)\.?amd64\.deb'

[shellcheck]
source = "github"
github = "koalaman/shellcheck"
use_latest_release = true
prefix = "v"
