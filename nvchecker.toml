[atuin-desktop]
source = "github"
github = "atuinsh/desktop"
use_latest_release = true
prefix = "v"

[bluebubbles]
source = "cmd"
cmd = "gh api 'repos/BlueBubblesApp/bluebubbles-app/releases?per_page=30' --jq '[.[] | select(.prerelease == false and .draft == false and any(.assets[]; .name == \"bluebubbles-linux-x86_64.tar.gz\"))][0].tag_name' | sed 's/^v//'"

[claude-desktop]
source = "apt"
mirror = "https://downloads.claude.ai/claude-desktop/apt/stable"
suite = "stable"
pkg = "claude-desktop"

[codiff]
source = "github"
github = "nkzw-tech/codiff"
use_latest_release = true
prefix = "v"

[crush]
source = "github"
github = "charmbracelet/crush"
use_latest_release = true
prefix = "v"

[dotenv-linter]
source = "github"
github = "dotenv-linter/dotenv-linter"
use_latest_release = true
prefix = "v"

[flyctl]
source = "github"
github = "superfly/flyctl"
use_latest_release = true
prefix = "v"

[github-copilot-app]
source = "github"
github = "github/app"
use_latest_release = true
prefix = "v"

[gitbutler]
source = "regex"
url = "https://app.gitbutler.com/releases/release?limit=1"
regex = 'releases/release/([0-9.]+-[0-9]+)/linux/x86_64/'
from_pattern = '^([0-9.]+)-([0-9]+)$'
to_pattern = '\1.\2'

[handy]
source = "github"
github = "cjpais/Handy"
use_latest_release = true
prefix = "v"

[helium-browser]
source = "github"
github = "imputnet/helium-linux"
use_latest_release = true

[heroic-games-launcher]
source = "github"
github = "Heroic-Games-Launcher/HeroicGamesLauncher"
use_latest_release = true
prefix = "v"

[jjui]
source = "github"
github = "idursun/jjui"
use_latest_release = true
prefix = "v"

[littlesnitch]
source = "regex"
url = "https://obdev.at/products/littlesnitch-linux/download.html"
regex = 'littlesnitch-([0-9]+\.[0-9]+\.[0-9]+-[0-9]+)-x86_64\.pkg\.tar\.zst'
from_pattern = '^(.*)-([0-9]+)$'
to_pattern = '\1_\2'

[opencode-desktop]
source = "cmd"
cmd = "gh api 'repos/anomalyco/opencode/releases?per_page=50' --jq '[.[] | select(.prerelease == false and .draft == false and any(.assets[]; .name == \"opencode-desktop-linux-amd64.deb\"))][0].tag_name' | sed 's/^v//'"

[overmind]
source = "github"
github = "DarthSim/overmind"
use_latest_release = true
prefix = "v"

[pandoc]
source = "github"
github = "jgm/pandoc"
use_latest_release = true

[paper-design]
source = "httpheader"
url = "https://download.paper.design/linux/deb"
header = "Content-Disposition"
regex = 'paper-desktop-([\d.]+?)\.?amd64\.deb'

[shellcheck]
source = "github"
github = "koalaman/shellcheck"
use_latest_release = true
prefix = "v"

[teams-for-linux]
source = "github"
github = "IsmaelMartinez/teams-for-linux"
use_latest_release = true
prefix = "v"

[visual-studio-code]
source = "github"
github = "microsoft/vscode"
use_latest_release = true

[voxtype-vulkan]
source = "cmd"
cmd = "gh api 'repos/peteonrails/voxtype/releases?per_page=30' --jq '[.[] | select(.prerelease == false and .draft == false and any(.assets[]; .name | test(\"linux-x86_64-vulkan$\")))][0].tag_name' | sed 's/^v//'"

[walker]
source = "github"
github = "abenz1267/walker"
use_latest_release = true
prefix = "v"

[warp-terminal]
source = "regex"
url = "https://app.warp.dev/get_warp?package=pacman"
regex = "v(0\\.[0-9.]+\\.stable_[0-9]+)"

[webcord]
source = "github"
github = "SpacingBat3/WebCord"
use_latest_release = true
prefix = "v"

[whispering]
source = "github"
github = "epicenter-so/epicenter"
use_latest_release = true
prefix = "v"

[yay]
source = "github"
github = "Jguer/yay"
