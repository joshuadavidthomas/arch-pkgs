name: publish

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      initialize:
        description: Create a new repository when no remote database exists
        required: false
        type: boolean
        default: false

concurrency:
  group: publish-packages
  cancel-in-progress: false

permissions: {}

defaults:
  run:
    shell: bash

env:
  PACMAN_REPO: josh
  R2_REMOTE: "r2:pkgs/arch/josh/os/x86_64"
  GPG_KEY_ID: 553F177AEECD8B668AAD3FA0A6D0CBC27AE90D91

jobs:
  publish:
    name: Build and publish packages
    runs-on: ubuntu-latest
    environment: publish
    container:
      image: archlinux@sha256:1047e6e7878d58e4ee47e1cd6459a32fab41246b0efc4109e11b7ef16f50b14d
    env:
      RCLONE_CONFIG_R2_TYPE: s3
      RCLONE_CONFIG_R2_PROVIDER: Cloudflare
      RCLONE_CONFIG_R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      RCLONE_CONFIG_R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      RCLONE_CONFIG_R2_ENDPOINT: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
      # Bucket-scoped R2 tokens cannot list/head buckets; without this rclone
      # falls back to CreateBucket and gets a 403.
      RCLONE_CONFIG_R2_NO_CHECK_BUCKET: "true"
    steps:
      - name: Install workflow dependencies
        run: pacman -Syu --noconfirm --needed base-devel git rclone sudo uv

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - name: Validate repository metadata
        run: uv run pytest

      - name: Configure makepkg user
        run: |
          useradd -m builder
          echo 'PACKAGER="Josh Thomas <josh@joshthomas.dev>"' >> /etc/makepkg.conf
          chown -R builder:builder "$GITHUB_WORKSPACE"

      - name: Import signing key
        env:
          GPG_SIGNING_KEY: ${{ secrets.GPG_SIGNING_KEY }}
        run: |
          printf '%s' "$GPG_SIGNING_KEY" | sudo -H -u builder gpg --batch --import
          sudo -H -u builder gpg --list-secret-keys "$GPG_KEY_ID" >/dev/null

          committed_fingerprint=$(gpg --show-keys --with-colons josh.gpg |
            awk -F: '$1 == "fpr" { print $10; exit }')
          secret_fingerprint=$(sudo -H -u builder gpg --with-colons \
            --fingerprint "$GPG_KEY_ID" | awk -F: '$1 == "fpr" { print $10; exit }')
          if [[ "$committed_fingerprint" != "$GPG_KEY_ID" ||
                "$secret_fingerprint" != "$GPG_KEY_ID" ]]; then
            echo "Signing key fingerprint does not match $GPG_KEY_ID" >&2
            exit 1
          fi

      - name: Download repo database
        run: |
          mkdir -p repo
          rclone copy "$R2_REMOTE" repo \
            --include "$PACMAN_REPO.db.tar.zst" \
            --include "$PACMAN_REPO.files.tar.zst"
          chown -R builder:builder repo

      - name: Require existing repo database
        env:
          INITIALIZE: ${{ github.event_name == 'workflow_dispatch' && inputs.initialize || false }}
        run: |
          if [[ -f "repo/$PACMAN_REPO.db.tar.zst" ]]; then
            bsdtar -tf "repo/$PACMAN_REPO.db.tar.zst" >/dev/null
          elif [[ "$INITIALIZE" == "true" ]]; then
            echo "Initializing a new repository."
          else
            echo "Remote repository database is missing; refusing to replace it." >&2
            echo "Use workflow_dispatch with initialize=true only for a new repository." >&2
            exit 1
          fi

      - name: Determine packages to build
        id: plan
        run: |
          existing=""
          if [[ -f "repo/$PACMAN_REPO.db.tar.zst" ]]; then
            existing=$(bsdtar -tf "repo/$PACMAN_REPO.db.tar.zst" | cut -d/ -f1 | sort -u)
          fi

          to_build=()
          for srcinfo in */.SRCINFO; do
            dir=${srcinfo%/.SRCINFO}
            if grep -qxF "$dir" publish-exclude.txt; then
              echo "Not published: $dir (redistribution restricted)"
              continue
            fi
            pkgname=$(sed -n 's/^pkgname = //p' "$srcinfo")
            pkgver=$(sed -n 's/^\tpkgver = //p' "$srcinfo")
            pkgrel=$(sed -n 's/^\tpkgrel = //p' "$srcinfo")
            epoch=$(sed -n 's/^\tepoch = //p' "$srcinfo")

            fullver="$pkgver-$pkgrel"
            [[ -n "$epoch" ]] && fullver="$epoch:$fullver"

            if ! grep -qxF "$pkgname-$fullver" <<< "$existing"; then
              echo "Will build: $pkgname $fullver ($dir)"
              to_build+=("$dir")
            else
              echo "Up to date: $pkgname $fullver ($dir)"
            fi
          done

          echo "dirs=${to_build[*]}" >> "$GITHUB_OUTPUT"

      - name: Build packages
        id: build
        if: steps.plan.outputs.dirs != ''
        env:
          BUILD_DIRS: ${{ steps.plan.outputs.dirs }}
        run: |
          failed=()
          for dir in $BUILD_DIRS; do
            echo "==> Building $dir..."
            if ! sudo -H -u builder \
              env PKGDEST="$GITHUB_WORKSPACE/repo" \
              bash -c "cd '$dir' && makepkg --nodeps --noconfirm --clean --sign --key '$GPG_KEY_ID'"; then
              echo "::error::Build failed for $dir"
              failed+=("$dir")
            fi
          done
          echo "failed=${failed[*]}" >> "$GITHUB_OUTPUT"
          shopt -s nullglob
          pkgs=(repo/*.pkg.tar.zst)
          if [[ ${#pkgs[@]} -gt 0 ]]; then
            echo "built=true" >> "$GITHUB_OUTPUT"
          else
            echo "built=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Update repo database
        if: steps.plan.outputs.dirs != ''
        run: |
          cd repo
          shopt -s nullglob
          pkgs=(*.pkg.tar.zst)
          if [[ ${#pkgs[@]} -eq 0 ]]; then
            echo "No packages built; skipping database update."
            exit 0
          fi
          sudo -H -u builder \
            repo-add --sign --key "$GPG_KEY_ID" "$PACMAN_REPO.db.tar.zst" "${pkgs[@]}"

      - name: Remove packages without redistribution rights
        id: exclusions
        run: |
          cd repo
          changed=false
          while IFS= read -r pkgname; do
            [[ -n "$pkgname" ]] || continue
            if bsdtar -tf "$PACMAN_REPO.db.tar.zst" 2>/dev/null |
                cut -d/ -f1 | sed 's/-[0-9].*$//' | grep -qxF "$pkgname"; then
              sudo -H -u builder repo-remove --sign --key "$GPG_KEY_ID" \
                "$PACMAN_REPO.db.tar.zst" "$pkgname"
              changed=true
            fi
          done < "$GITHUB_WORKSPACE/publish-exclude.txt"
          echo "changed=$changed" >> "$GITHUB_OUTPUT"

      - name: Upload to R2
        if: steps.build.outputs.built == 'true' || steps.exclusions.outputs.changed == 'true'
        run: |
          cd repo
          shopt -s nullglob
          pkgs=(*.pkg.tar.zst)
          # Packages first so the db never references files that are not yet uploaded.
          # Package filenames are unique per version, so cache them forever; the
          # db/sig objects mutate in place and must never be CDN-cached.
          if [[ ${#pkgs[@]} -gt 0 ]]; then
            rclone copy . "$R2_REMOTE" \
              --include "*.pkg.tar.zst" --include "*.pkg.tar.zst.sig" \
              --header-upload "Cache-Control: public, max-age=31536000, immutable"
          fi
          for f in db files; do
            rclone copyto --header-upload "Cache-Control: no-cache" \
              "$PACMAN_REPO.$f.tar.zst" "$R2_REMOTE/$PACMAN_REPO.$f.tar.zst"
            rclone copyto --header-upload "Cache-Control: no-cache" \
              "$PACMAN_REPO.$f.tar.zst.sig" "$R2_REMOTE/$PACMAN_REPO.$f.tar.zst.sig"
            rclone copyto --header-upload "Cache-Control: no-cache" \
              "$PACMAN_REPO.$f.tar.zst" "$R2_REMOTE/$PACMAN_REPO.$f"
            rclone copyto --header-upload "Cache-Control: no-cache" \
              "$PACMAN_REPO.$f.tar.zst.sig" "$R2_REMOTE/$PACMAN_REPO.$f.sig"
          done

      - name: Delete excluded package artifacts
        run: |
          while IFS= read -r pkgname; do
            [[ -n "$pkgname" ]] || continue
            rclone delete "$R2_REMOTE" \
              --include "$pkgname-*.pkg.tar.zst" \
              --include "$pkgname-*.pkg.tar.zst.sig"
          done < publish-exclude.txt

      - name: Upload public key
        run: |
          rclone copyto --header-upload "Cache-Control: no-cache" \
            josh.gpg "r2:pkgs/josh.gpg"

      - name: Report build failures
        if: steps.build.outputs.failed != ''
        run: |
          echo "Builds failed for: ${{ steps.build.outputs.failed }}"
          exit 1
