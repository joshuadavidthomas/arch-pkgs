name: update

on:
  schedule:
    - cron: "0 10 * * *"
  workflow_dispatch:

concurrency:
  group: update-packages
  cancel-in-progress: false

permissions: {}

defaults:
  run:
    shell: bash

jobs:
  update:
    name: Update package metadata
    runs-on: ubuntu-latest
    container:
      image: archlinux@sha256:1047e6e7878d58e4ee47e1cd6459a32fab41246b0efc4109e11b7ef16f50b14d
    permissions:
      contents: write # Push the automated update branch.
      pull-requests: write # Open or update the automated package update PR.
    steps:
      - name: Install workflow dependencies
        run: pacman -Syu --noconfirm --needed base-devel pacman-contrib python git github-cli sudo uv

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - name: Validate repository metadata
        run: uv run pytest

      - name: Configure makepkg user
        run: |
          useradd -m builder
          chown -R builder:builder "$GITHUB_WORKSPACE"

      - name: Run package updates
        id: updates
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          sudo --preserve-env=GITHUB_TOKEN -u builder
          ./update.py --failure-file /tmp/update-failures

      - name: Create pull request
        working-directory: ${{ github.workspace }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH_NAME: automated/update-packages
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

          changes="$(git status --porcelain)"
          if [[ -z "$changes" ]]; then
            echo "No package metadata changes."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH_NAME"
          git add .
          git commit -m "Update package metadata"
          gh auth setup-git
          git fetch origin \
            "+refs/heads/$BRANCH_NAME:refs/remotes/origin/$BRANCH_NAME" || true
          git push --force-with-lease origin "$BRANCH_NAME"

          open_pr=$(gh pr list \
            --repo "$GITHUB_REPOSITORY" \
            --head "$BRANCH_NAME" \
            --state open \
            --json number \
            --jq '.[0].number // empty')
          if [[ -n "$open_pr" ]]; then
            gh pr edit "$open_pr" \
              --repo "$GITHUB_REPOSITORY" \
              --title "Update package metadata" \
              --body "Automated package metadata update from \`./update.py\`."
          else
            gh pr create \
              --repo "$GITHUB_REPOSITORY" \
              --base "${GITHUB_REF_NAME}" \
              --head "$BRANCH_NAME" \
              --title "Update package metadata" \
              --body "Automated package metadata update from \`./update.py\`."
          fi

      - name: Report update failures
        if: steps.updates.outcome == 'failure'
        run: |
          failures=$(cat /tmp/update-failures 2>/dev/null || printf 'unknown (see update logs)')
          echo "Package update failures: $failures" | tee -a "$GITHUB_STEP_SUMMARY"
          exit 1
